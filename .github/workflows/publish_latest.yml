name: Publish Latest Cymetric

on:
  # allows us to run workflows manually
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish_latest.yml'
  push:
    branches:
      - main

# The GITHUB_TOKEN of a pull request from a fork can only read packages,
# whatever the permissions of the jobs, so the images are only pushed to
# (and the registry cache only written to) ghcr.io for events from this
# repository. Pull requests from forks still build and test the images.
# Runs in the forks themselves (e.g. pushes to the main branch of a fork)
# cannot write to ghcr.io/cyclus either, so they do not push.
env:
  PUSH_IMAGES: ${{ github.repository == 'cyclus/cymetric' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  build-cymetric-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    strategy:
      matrix:
        ubuntu_versions : [
          20.04,
          22.04,
        ]
        pkg_mgr : [
          apt,
          conda,
        ]

    name: Build, Test, Publish
    steps:
      - name: Tag as ci-image-cache by default
        run: |
          echo "tag=ci-image-cache" >> "$GITHUB_ENV"

      - name: Tag as latest
        if: ${{ github.repository_owner == 'cyclus' && github.ref == 'refs/heads/main' }}
        run: |
          echo "tag=latest" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Test Cymetric
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=ghcr.io/cyclus/cymetric_${{ matrix.ubuntu_versions }}_${{ matrix.pkg_mgr }}/cymetric:ci-layer-cache
          # Write the registry cache only when pushing (it needs packages: write),
          # and otherwise set cache-to to '' so that no cache is exported. This
          # is the same cache as cache-from. GitHub Actions expressions cannot
          # nest ${{ }} or concatenate strings, so format() builds the cache
          # reference, replacing {0}, {1}, ... with the matrix values after it.
          cache-to: ${{ env.PUSH_IMAGES == 'true' && format('type=registry,ref=ghcr.io/cyclus/cymetric_{0}_{1}/cymetric:ci-layer-cache,mode=max', matrix.ubuntu_versions, matrix.pkg_mgr) || '' }}
          file: docker/Dockerfile
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ghcr.io/cyclus/cymetric_${{ matrix.ubuntu_versions }}_${{ matrix.pkg_mgr }}/cymetric:${{ env.tag }}
          build-args: |
            pkg_mgr=${{ matrix.pkg_mgr }}
            ubuntu_version=${{ matrix.ubuntu_versions }}
            cycamore_tag=latest
